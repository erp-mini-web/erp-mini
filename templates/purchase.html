<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>発注登録</title>
</head>
<body>

<p><a href="/">メニューへ戻る</a></p>

<h2>発注登録</h2>

<form method="POST">
    <label>仕入先：</label>
    <select name="supplier" required>
        {% for code, sup in suppliers.items() %}
        <option value="{{ code }}">{{ code }} ({{ sup.name }})</option>
        {% endfor %}
    </select><br><br>

    <label>品目：</label>
    <select name="item_code" required>
        {% for code, item in items.items() %}
            {% if code in purchase_items %}
            <option value="{{ code }}">{{ code }} ({{ item.name }})</option>
            {% endif %}
        {% endfor %}
    </select><br><br>

    <label>数量：</label>
    <input type="number" name="qty" required><br><br>

    <label>希望納期：</label>
    <input type="date" name="due" required><br><br>

    <button type="submit">登録</button>
</form>

</body>
</html>
