<h2>受注画面</h2>

<form method="post">

  <label>商品コード：</label>
  <select name="product">
    <option value="">選択して</option>
    {% for code in products %}
      <option value="{{ code }}" {% if selected_product == code %}selected{% endif %}>
        {{ code }}
      </option>
    {% endfor %}
  </select>

  <br><br>

  <label>数量：</label>
  <input type="number" name="quantity" min="1" value="{{ quantity or '' }}">

  <br><br>

  <button type="submit" name="action" value="show">原材料を表示</button>

  {% if recipe %}
    <h3>必要な中間材ロールを選択</h3>

    {% for k_code, rolls in stock_K.items() %}
      {% if need[k_code] > 0 %}
        <h4>{{ k_code }}（必要量：{{ need[k_code] }}m）</h4>

        {% for r in rolls %}
          <label>
            <input type="radio" name="roll_{{ k_code }}" value="{{ r }}"
              {% if loop.first %}checked{% endif %}>
            {{ r }}m ロール
          </label><br>
        {% endfor %}
      {% endif %}
    {% endfor %}

    <br>
    <button type="submit" name="action" value="submit">受注する</button>
  {% endif %}

</form>

<a href="/">メニューに戻る</a>
