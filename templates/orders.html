<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>受注登録</title>
</head>
<body>

<p><a href="/">メニューへ戻る</a></p>

<h2>受注登録</h2>

<form method="POST">
    <label>得意先：</label>
    <select name="customer" required>
        {% for c in customers %}
        <option value="{{ c }}">{{ c }}</option>
        {% endfor %}
    </select><br><br>

    <label>納品先：</label>
    <select name="destination" required>
        {% for d in customers[selected_customer].destinations %}
        <option value="{{ d }}">{{ d }}</option>
        {% endfor %}
    </select><br><br>

    <label>品目：</label>
    <select name="item_code" required>
        {% for code, item in items.items() %}
        <option value="{{ code }}">{{ code }} ({{ item.name }})</option>
        {% endfor %}
    </select><br><br>

    <label>数量：</label>
    <input type="number" name="qty" required><br><br>

    <label>納期：</label>
    <input type="date" name="due" required><br><br>

    <button type="submit">登録</button>
</form>

</body>
</html>
