<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>受注一覧</title>
</head>
<body>

<p><a href="/">メニューへ戻る</a></p>

<h2>受注一覧</h2>

<table border="1">
    <tr>
        <th>受注番号</th>
        <th>得意先</th>
        <th>納品先</th>
        <th>品目コード</th>
        <th>品目名</th>
        <th>数量</th>
        <th>納期</th>
    </tr>

    {% for o in orders %}
    <tr>
        <td>{{ o.order_no }}</td>
        <td>{{ o.customer }}</td>
        <td>{{ o.destination }}</td>
        <td>{{ o.item_code }}</td>
        <td>{{ items[o.item_code].name }}</td>
        <td>{{ o.qty }}</td>
        <td>{{ o.due }}</td>
    </tr>
    {% endfor %}
</table>

</body>
</html>
