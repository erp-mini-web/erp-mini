<h2>受注一覧（ERP-mini）</h2>

<table border="1" cellpadding="5">
  <tr>
    <th>受注番号</th>
    <th>受注日</th>
    <th>お客様</th>
    <th>発送先</th>
    <th>配送方法</th>
    <th>入力者</th>
    <th>明細数</th>
  </tr>

  {% for o in orders %}
    <tr>
      <td>{{ o.order_no }}</td>
      <td>{{ o.order_date }}</td>
      <td>{{ o.customer }}</td>
      <td>{{ o.destination }}</td>
      <td>{{ o.shipping_method }}</td>
      <td>{{ o.input_user }}</td>
      <td>{{ o.details|length }}</td>
    </tr>
  {% endfor %}
</table>

<br>
<a href="/">メニューに戻る</a>
