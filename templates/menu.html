<!DOCTYPE html>

    <style>
        body {
            font-family: "Segoe UI", sans-serif;
            margin: 40px;
            background: #f7f7f7;
            color: #333;
        }

        h2 {
            margin-bottom: 20px;
            font-size: 26px;
            border-left: 6px solid #4a90e2;
            padding-left: 10px;
        }

        h3 {
            margin-top: 30px;
            font-size: 20px;
            color: #4a90e2;
            border-bottom: 1px solid #ddd;
            padding-bottom: 4px;
        }

        a {
            display: block;
            padding: 8px 12px;
            margin: 6px 0;
            background: white;
            border-radius: 6px;
            text-decoration: none;
            color: #333;
            border: 1px solid #e0e0e0;
            transition: 0.15s;
        }

        a:hover {
            background: #4a90e2;
            color: white;
            border-color: #4a90e2;
        }

        /* スマホ対応 */
        @media (max-width: 600px) {
            body {
                margin: 20px;
            }
        }
    </style>
</head>
