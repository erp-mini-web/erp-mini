<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>メニュー</title>

    <style>
        body {
            font-family: "Segoe UI", sans-serif;
            margin: 40px;
            background: #f7f7f7;
            color: #333;
        }

        h2 {
            margin-bottom: 20px;
            font-size: 26px;
            border-left: 6px solid #4a90e2;
            padding-left: 10px;
        }

        h3 {
            font-size: 20px;
            color: #4a90e2;
            margin-bottom: 10px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 4px;
        }

        /* ▼ ボタン固定サイズ（受注登録と同じ） */
        .menu-btn {
            display: inline-block;
            width: 160px;       /* ← 固定幅 */
            padding: 12px;
            background: white;
            border-radius: 6px;
            text-decoration: none;
            color: #333;
            border: 1px solid #e0e0e0;
            text-align: center;
            transition: 0.15s;
            font-weight: 500;
            margin: 5px;
        }

        .menu-btn:hover {
            background: #4a90e2;
            color: white;
            border-color: #4a90e2;
        }

        /* ▼ ボタンを横に並べる */
        .menu-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        /* ▼ マスタ管理とトレーサビリティを横に並べる2カラム */
        .two-column {
            display: flex;
            gap: 40px;
            margin-bottom: 30px;
        }

        .column {
            flex: 1;
        }
    </style>
</head>
<body>

<h2>メニュー</h2>

<!-- 購買 -->
<h3>購買</h3>
<div class="menu-group">
    <a class="menu-btn" href="/purchase">発注登録</a>
    <a class="menu-btn" href="/receipts">入庫登録</a>
    <a class="menu-btn" href="/stocks">在庫一覧</a>
    <a class="menu-btn" href="/move">棚番移動</a>
</div>

<!-- 生産・出荷 -->
<h3>生産・出荷</h3>
<div class="menu-group">
    <a class="menu-btn" href="/orders">受注登録</a>
    <a class="menu-btn" href="/orders_list">受注一覧</a>
    <a class="menu-btn" href="/production">製造実績登録</a>
    <a class="menu-btn" href="/production_list">製造実績一覧</a>
    <a class="menu-btn" href="/shipping">出荷管理</a>
    <a class="menu-btn" href="/shipping_list">出荷実績一覧</a>
</div>

<!-- ▼ マスタ管理とトレーサビリティを横に並べる -->
<div class="two-column">

    <div class="column">
        <h3>マスタ管理</h3>
        <div class="menu-group">
            <a class="menu-btn" href="/masters">マスタ一覧</a>
        </div>
    </div>

    <div class="column">
        <h3>トレーサビリティ</h3>
        <div class="menu-group">
            <a class="menu-btn" href="/lot_trace">ロットトレース</a>
        </div>
    </div>

</div>

<!-- 棚卸 -->
<h3>棚卸</h3>
<div class="menu-group">
    <a class="menu-btn" href="/inventory">棚卸</a>
    <a class="menu-btn" href="/inventory_diff">棚卸差異一覧</a>
</div>

</body>
</html>
