<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>メニュー</title>

    <style>
        body {
            font-family: "Segoe UI", sans-serif;
            margin: 40px;
            background: #f7f7f7;
            color: #333;
        }

        h2 {
            margin-bottom: 20px;
            font-size: 26px;
            border-left: 6px solid #4a90e2;
            padding-left: 10px;
        }

        h3 {
            margin-top: 30px;
            font-size: 20px;
            color: #4a90e2;
            border-bottom: 1px solid #ddd;
            padding-bottom: 4px;
        }

        /* ▼ 分類ごとのボタンを横並びにする */
        .menu-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 10px;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .menu-btn {
            display: block;
            padding: 12px;
            background: white;
            border-radius: 6px;
            text-decoration: none;
            color: #333;
            border: 1px solid #e0e0e0;
            text-align: center;
            transition: 0.15s;
            font-weight: 500;
        }

        .menu-btn:hover {
            background: #4a90e2;
            color: white;
            border-color: #4a90e2;
        }

        @media (max-width: 600px) {
            body {
                margin: 20px;
            }
        }
    </style>
</head>
<body>

<h2>メニュー</h2>

<!-- マスタ -->
<h3>マスタ管理</h3>
<div class="menu-group">
    <a class="menu-btn" href="/masters">マスタ一覧</a>
</div>

<!-- 購買 -->
<h3>購買</h3>
<div class="menu-group">
    <a class="menu-btn" href="/purchase">発注登録</a>
    <a class="menu-btn" href="/receipts">入庫登録</a>
    <a class="menu-btn" href="/stocks">在庫一覧</a>
</div>

<!-- 受注・製造・出荷 -->
<h3>生産・出荷</h3>
<div class="menu-group">
    <a class="menu-btn" href="/orders">受注登録</a>
    <a class="menu-btn" href="/orders_list">受注一覧</a>
    <a class="menu-btn" href="/production">製造実績登録</a>
    <a class="menu-btn" href="/production_list">製造実績一覧</a>
    <a class="menu-btn" href="/shipping">出荷管理</a>
    <a class="menu-btn" href="/shipping_list">出荷実績一覧</a>
</div>

<!-- トレース -->
<h3>トレーサビリティ</h3>
<div class="menu-group">
    <a class="menu-btn" href="/lot_trace">ロットトレース</a>
</div>

<!-- 棚卸 -->
<h3>棚卸</h3>
<div class="menu-group">
    <a class="menu-btn" href="/inventory">棚卸</a>
    <a class="menu-btn" href="/inventory_diff">棚卸差異一覧</a>
</div>

</body>
</html>
