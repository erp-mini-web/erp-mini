<h2>出荷画面</h2>

<form method="post">
  <label>商品コード：</label>
  <select name="product">
    {% for code in stock_Y.keys() %}
      <option value="{{ code }}">{{ code }}</option>
    {% endfor %}
  </select>

  <label>数量：</label>
  <input type="number" name="quantity" min="1">

  <button type="submit">出荷する</button>
</form>

<a href="/">メニューに戻る</a>
