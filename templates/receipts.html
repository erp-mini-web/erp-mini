<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>入庫管理</title>
</head>
<body>

<p><a href="/">メニューへ戻る</a></p>

<h2>入庫管理</h2>

<form method="POST">

    <label>品目コード：</label>
    <select name="item_code">
        {% for code, item in items.items() %}
            <option value="{{ code }}">{{ code }} ({{ item.name }})</option>
        {% endfor %}
    </select>
    <br><br>

    <label>棚番：</label>
    <select name="location_code">
        {% for code, loc in locations.items() %}
            <option value="{{ code }}">{{ code }} ({{ loc.desc }})</option>
        {% endfor %}
    </select>
    <br><br>

    <label>数量：</label>
    <input type="number" name="qty" required>
    <br><br>

    <label>受注番号（任意）：</label>
    <input type="text" name="order_no">
    <br><br>

    <button type="submit">入庫する</button>
</form>

</body>
</html>
