<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>入庫登録</title>
</head>
<body>

<p><a href="/">メニューへ戻る</a></p>

<h2>入庫登録（発注番号＋棚番）</h2>

<form method="POST">

    <!-- 発注番号選択 -->
    <label>発注番号：</label>
    <select name="po_no" required>
        {% for p in purchases %}
        <option value="{{ p.po_no }}">
            {{ p.po_no }} /
            {{ suppliers[p.supplier].name }} /
            {{ p.item_code }} ({{ items[p.item_code].name }})
        </option>
        {% endfor %}
    </select>
    <br><br>

    <!-- 入荷場所（棚番） -->
    <label>入荷場所：</label>
    <select name="location" required>
        {% for code, name in locations.items() %}
        <option value="{{ code }}">{{ code }} ({{ name }})</option>
        {% endfor %}
    </select>
    <br><br>

    <!-- 入荷数量 -->
    <label>入荷数量：</label>
    <input type="number" name="qty" required>
    <br><br>

    <button type="submit">登録</button>

</form>

</body>
</html>
